<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FashionRUs — Produkt</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="site-header">
        <nav class="nav" aria-label="Hovednavigation">
            <a class="brand" href="index.html">FashionRUs</a>
        </nav>
    </header>

    <main class="container section">
        <section class="product-page">
            <div class="product-page-grid">

                <figure class="product-page-media">
                    <img src="" alt="" />
                </figure>

                <div class="product-page-info">
                    <h1 class="product-title"></h1>
                    <p class="product-meta"></p>

                    <p class="price big">
                        <span class="price-old"></span>
                        <span class="price-now"></span>
                    </p>

                    <p class="lagerstatus">
                        <span class="status"></span>
                    </p>

                    <button class="btn">Add to basket</button>
                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>2026 FashionRUs — KEA opgave (dynamisk site)</p>
        </div>
    </footer>

    <script src="productdetails.js"></script>
</body>

</html>
